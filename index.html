    <script>
        window.onload = function() {
            // safari用に最初に背景画像を読み込んで表示
            const backgroundImage = new Image(); // 画像のインスタンス作成
            backgroundImage.src = './data/image/background_image.jpg'; // 背景画像のパス
            backgroundImage.onload = function() {
                // 画像の読み込みが完了したら背景として設定
                document.body.style.backgroundImage = `url('${backgroundImage.src}')`;
                document.body.style.backgroundSize = 'cover'; // 画像を画面全体にフィット

                // 次にビデオの表示を開始
                const video = document.getElementById('video-background');
                video.style.display = 'block'; // ビデオを表示
                video.load(); // ビデオを読み込み
                video.play(); // ビデオの再生を開始
            };
        };
    </script>
