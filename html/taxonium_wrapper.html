<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Taxonium Wrapper</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/atlas_page.css">
  <style>
    html, body, #frameContainer { width: 100%; height: 100%; margin: 0; }
    body, #frameContainer { overflow: hidden; }
    .taxonium-inner-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }
  </style>
</head>
<body data-theme-embedded>
  <script src="../js/theme.js?v=20260722"></script>
  <div id="frameContainer"></div>
  <script>
    (function(){
      try {
        const params = new URLSearchParams(location.search);
        const og = params.get('og') || 'OG0000000';
        const ts = params.get('ts') || Date.now();

        const treeUrl = 'https://raw.githubusercontent.com/stsnsn/SAR11_Atlas/master/data/phylogeny/tree/SAR11_542_SCG165_iqtree_rooted_SAR11_only.tree';
        const metaUrl = 'https://raw.githubusercontent.com/stsnsn/SAR11_Atlas/master/data/phylogeny/tree/tree_annottable_ogpage_542.tsv';
        const colorParam = encodeURIComponent(JSON.stringify({ field: `meta_${og}` }));

        const taxoniumUrl = `https://taxonium.org/?treeUrl=${encodeURIComponent(treeUrl)}&ladderizeTree=true&treeType=nwk&metaUrl=${encodeURIComponent(metaUrl)}&metaType=meta_tsv&xType=x_dist&color=${colorParam}&ts=${ts}`;

        const container = document.getElementById('frameContainer');
        container.innerHTML = '';
        const iframe = document.createElement('iframe');
        iframe.src = taxoniumUrl;
        iframe.className = 'taxonium-inner-frame';
        iframe.title = 'Taxonium phylogenetic tree viewer';
        iframe.setAttribute('data-no-embed-status', '');
        iframe.allowFullscreen = true;
        container.append(iframe);
      } catch (e) {
        console.error('taxonium_wrapper error', e);
        document.getElementById('frameContainer').innerText = 'Failed to load Taxonium.';
      }
    })();
  </script>
</body>
</html>
