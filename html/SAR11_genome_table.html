<!DOCTYPE html>
<html>
<head>
    <title>SAR11 Genome list</title>

</head>
<body>
    <!-- ローカルに保存したJSを読み込む -->
    <script src="../js/jquery-3.6.0.min.js"></script>
    <script src="../js/jquery.dataTables.min.js"></script>
    <script src="../js/dataTables.buttons.min.js"></script>
    <script src="../js/jszip.min.js"></script>
    <script src="../js/pdfmake.min.js"></script>
    <script src="../js/vfs_fonts.js"></script>
    <script src="../js/buttons.html5.min.js"></script>
    <script src="../js/buttons.print.min.js"></script>
    <script src="../js/papaparse.min.js"></script>
    <link rel="stylesheet" href="../css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="../css/buttons.dataTables.min.css">


    <!-- 表・ダークモード色CSS -->
    <link rel="stylesheet" href="../css/data_table_style.css">

    <!-- Dark-mode toggle -->
    <button id="toggleTheme" class="theme-toggle mb-3" type="button" data-theme-toggle aria-pressed="false">Deep mode</button>
    <script src="../js/theme.js"></script>
    <!-- Dark-mode toggle END -->

    <table id="table" class="display" style="width:100%">
        <caption>Metadata for 562 genomes: 542 SAR11 genomes and 20 phylogenetic outgroups</caption>
        <thead>
            <tr></tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        $(document).ready(function () {
            // GitHub上のCSV/TSVファイルのURL
            const fileUrl = "../data/phylogeny/subclade.txt";

            // Papa Parseを使ってデータを取得
            Papa.parse(fileUrl, {
                download: true,
                delimiter: "\t", // TSVの場合
                header: true, // ヘッダー行を利用
                skipEmptyLines: true,
                complete: function (result) {
                    const data = result.data; // データ部分
                    const headers = Object.keys(data[0]); // ヘッダー部分

                    // ヘッダー行を生成
                    let headerHtml = "";
                    headers.forEach(header => {
                        headerHtml += `<th>${header}</th>`;
                    });
                    $("#table thead tr").html(headerHtml);

                    // ボディ部分を生成
                    let bodyHtml = "";
                    data.forEach(row => {
                        bodyHtml += "<tr>";
                        headers.forEach(header => {
                            bodyHtml += `<td>${row[header]}</td>`;
                        });
                        bodyHtml += "</tr>";
                    });
                    $("#table tbody").html(bodyHtml);

                    // DataTableを適用
                    const genomeTable = $("#table").DataTable({
                        dom: "Bfrtipl",
                        pageLength: 10,
                        autoWidth: true,
                        buttons: ["copy", "csv",
                            {
                                text: "JSON", // JSONボタン
                                action: function (e, dt, node, config) {
                                    const data = dt.buttons.exportData();
                                    const json = JSON.stringify(data);
                                    const blob = new Blob([json], { type: "application/json" });
                                    const link = document.createElement("a");
                                    link.href = URL.createObjectURL(blob);
                                    link.download = "table_data.json";
                                    document.body.appendChild(link);
                                    link.click();
                                    document.body.removeChild(link);
                                }
                        }, "excel", "print"],
                        responsive: false,
                        lengthMenu: [[10, 25, 50, -1], [10, 25, 50, "All"]],
                        searching: true,
                        ordering: true,
                        scroller: false,
                        language: {
                            infoEmpty: "No data available",
                            lengthMenu: "Show _MENU_ entries",
                            info: "Showing _START_ to _END_ of _TOTAL_ entries",
                            search: "Search:",
                            paginate: {
                                first: "First",
                                previous: "Previous",
                                next: "Next",
                                last: "Last"
                            }
                        }
                    });
                }
            });
        });
    </script>
</body>
</html>
