	<meta charset="utf-8">

<body data-theme-embedded>

		<caption>loading...</caption>
	</table>

	<!--<script src="../js/dataTables.scroller.min.js"></script>-->

	<script>
		$(document).ready(function() {
			// Load TSV via PapaParse and initialize DataTable
			Papa.parse("../data/structure/uniprot_structure_references.tsv", {
				download: true,
				header: true,
				delimiter: "\t",
				skipEmptyLines: true,
				complete: function(results) {
					var data = results.data || [];
					var fields = (results.meta && results.meta.fields) || [];

					// Build the table header dynamically
					var $table = $("#table");
					$table.empty();
					var $thead = $("<thead><tr></tr></thead>");
					fields.forEach(function(f) { $thead.find('tr').append($('<th>').text(f)); });
					$table.append($thead);

					// Prepare DataTables columns
					var columns = fields.map(function(f) {
						var col = { data: f, title: f };
						try {
							var lname = (f || '').toString().toLowerCase();

							// Accession-like column -> open genes_linked_to_3d_structures with afdb param
							var isAccession = (lname === 'accession_number' || lname === 'accession' || lname.indexOf('accession') !== -1 || lname.indexOf('acc') === 0);

							// Orthogroup-like column -> open SAR11_OG_info with ogInput param
							var isOG = (lname === 'orthogroup' || lname.indexOf('orthogroup') !== -1 || lname === 'og' || lname === 'og_id' || lname === 'orthogroup_id');
							var isMatchType = (lname === 'structure_match_type');

							if (isAccession) {
								col.render = function(data, type, row, meta) {
									if (!data) return '';
									try {
										var esc = encodeURIComponent(data);
										var href = './genes_linked_to_3d_structures.html?afdb=' + esc;
										return '<a target="_top" rel="noopener noreferrer" href="' + href + '">' + data + '</a>';
									} catch (e) {
										return data;
									}
								};
							} else if (isOG) {
								col.render = function(data, type, row, meta) {
									if (!data) return '';
									try {
										var esc = encodeURIComponent(data);
										var href = './SAR11_OG_info.html?ogInput=' + esc;
										return '<a target="_blank" rel="noopener noreferrer" href="' + href + '">' + data + '</a>';
									} catch (e) {
										return data;
									}
								};
							} else if (isMatchType) {
								col.render = function(data, type, row) {
									var identity = Number(row.pident);
									var queryCoverage = Number(row.qcovhsp);
									var subjectCoverage = Number(row.scovhsp);
									if (identity === 100 && queryCoverage === 100 && subjectCoverage === 100) {
										return 'Exact sequence match';
									}
									if (identity >= 85 && queryCoverage >= 80 && subjectCoverage >= 80) {
										return 'Close sequence match';
									}
									return 'Distant homologous match';
								};
							}
						} catch (e) { /* ignore */ }
						return col;
					});

					// Initialize DataTable with buttons
					$table.DataTable({
						data: data,
						columns: columns,
						dom: 'Bfrtip',
						buttons: [
							{ extend: 'csvHtml5', text: 'CSV' },
							{ extend: 'excelHtml5', text: 'Excel' },
							{ extend: 'pdfHtml5', text: 'PDF' },
							{ extend: 'print', text: 'Print' }
						],
						pageLength: 25,
                        scrollX: true, // enable horizontal scrolling so header and body scroll together
                        fixedHeader: true, // ヘッダーを固定表示
						responsive: true
					});
				},
				error: function(err) { console.error('PapaParse error:', err); }
			});
		});
	</script>
